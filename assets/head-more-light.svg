<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="104" role="img" aria-label="03 MORE PROJECTS">
  <style>
    @font-face { font-family: 'Mona Sans'; font-weight: 300; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    .num { font: 300 44px 'Mona Sans', system-ui, sans-serif; fill: #131922; }
    .label { font: 500 12.8px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; fill: #131922; }
    .aside { fill: #656b74; }
    /* The line on the right does not fit beside the label on phones. */
    @media (max-width: 419.98px) { .aside { display: none; } }
  </style>
  <text class="num" x="0" y="70">03</text>
  <text class="label" x="69.7" y="70">MORE PROJECTS</text>
  <svg x="100%" overflow="visible"><text class="label aside" x="0" y="70" text-anchor="end">TEAM / SCHOOL / HOBBY</text></svg>
  <rect y="86" width="100%" height="1" fill="rgb(19 25 34 / 0.28)"/>
  <!-- The stroke sits on the hairline, as wide as the number. -->
  <rect y="86" width="52.1" height="2" fill="#195fbf"/>
</svg>
