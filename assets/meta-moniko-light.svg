<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="30" role="img" aria-label="New. App, on the web.">
  <style>
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font: 500 11.2px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; }
    .kind { fill: #656b74; }
    .tag { fill: #49505b; }
    .box { fill: none; stroke: rgb(19 25 34 / 0.28); stroke-width: 1; }
    /* Kommer snart: streckad kant och svagare text, ingen färg. */
    .box.soon { stroke-dasharray: 3 2; }
    .tag.soon { fill: #656b74; }
    .sq { fill: #195fbf; }
    .new { font-weight: 600; fill: #195fbf; }
    .row { transform-origin: 0 15px; }
    @media (max-width: 142px) { .row { transform: scale(0.92); } }
    @media (max-width: 130px) { .row { transform: scale(0.84); } }
    @media (max-width: 119px) { .row { transform: scale(0.76); } }
  </style>
  <g class="row">
  <rect class="sq" x="0" y="11" width="8" height="8"/>
  <text class="new" x="17" y="19">NEW</text>
  <text class="kind" x="58.79" y="19">APP</text>
  <rect class="box" x="101.08" y="4" width="39.75" height="21.7"/>
  <text class="tag" x="108.86" y="19">WEB</text>
  </g>
</svg>
