<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="30" role="img" aria-label="Game, on Google Play and the web.">
  <style>
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font: 500 11.2px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; }
    .kind { fill: #656b74; }
    .tag { fill: #49505b; }
    .box { fill: none; stroke: rgb(19 25 34 / 0.28); stroke-width: 1; }
    /* Coming soon: a dashed box and fainter text, no colour. */
    .box.soon { stroke-dasharray: 3 2; }
    .tag.soon { fill: #656b74; }
    .sq { fill: #195fbf; }
    .new { font-weight: 600; fill: #195fbf; }
    .row { transform-origin: 0 15px; }
    @media (max-width: 203px) { .row { transform: scale(0.92); } }
    @media (max-width: 186px) { .row { transform: scale(0.84); } }
    @media (max-width: 170px) { .row { transform: scale(0.76); } }
  </style>
  <g class="row">
  <text class="kind" x="0" y="19">GAME</text>
  <rect class="box" x="50.36" y="4" width="104.26" height="21.7"/>
  <text class="tag" x="58.14" y="19">GOOGLE PLAY</text>
  <rect class="box" x="162.02" y="4" width="39.75" height="21.7"/>
  <text class="tag" x="169.8" y="19">WEB</text>
  </g>
</svg>
