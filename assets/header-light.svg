<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" role="img" aria-label="Sebastian Valdemarsson, Kalmar. Building stuff I actually want to use.">
  <style>
    @font-face { font-family: 'Mona Sans'; font-weight: 700; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
    .eye { font: 500 11.5px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; fill: #656b74; }
    .name { font-weight: 600; fill: #195fbf; }
    .sq { fill: #195fbf; }
    .h1 { font: 700 60px 'Mona Sans', system-ui, sans-serif; letter-spacing: -0.035em; fill: #131922; }
    .dot { fill: #195fbf; }
    .p { fill: none; stroke: #195fbf; stroke-width: 1.5; }
    .s { opacity: 0; transform-box: fill-box; transform-origin: center; }
    /* Twinkle only with a mouse. On phones the constant repaints made the
       GitHub app's scrollbar flicker. */
    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      .s { animation: twinkle 13s ease-in-out infinite; }
    }
    @keyframes twinkle {
      0%, 30%, 100% { opacity: 0; transform: scale(0.7); }
      14% { opacity: 1; transform: scale(1); }
    }
    /* Three layouts by the image's own width: the headline on two lines at 60 and
       48 px, and on phones three lines without the coordinates and the stars. */
    .m, .n { display: none; }
    @media (max-width: 719.98px) {
      .w { display: none; }
      .m { display: inline; }
      .h1 { font-size: 48px; }
    }
    @media (max-width: 579.98px) {
      .m, .stars { display: none; }
      .n { display: inline; }
      .h1 { font-size: 36px; }
      .eye { font-size: 11px; }
    }
    @media (max-width: 285px) {
      .place { display: none; }
    }
    /* "Building stuff" is 6.08 em: at 36 px it needs 24 + 219 px. Narrower than
       that, as on a 320 px phone, the headline was cut. */
    @media (max-width: 249.98px) {
      .h1 { font-size: 32px; }
    }
  </style>
  <defs>
    
    <pattern id="minor-w" width="48" height="48" x="40" y="24" patternUnits="userSpaceOnUse">
      <rect width="1" height="48" fill="rgb(25 95 191 / 0.09)"/><rect width="48" height="1" fill="rgb(25 95 191 / 0.09)"/>
    </pattern>
    <pattern id="major-w" width="192" height="192" x="40" y="24" patternUnits="userSpaceOnUse">
      <rect width="1" height="192" fill="rgb(25 95 191 / 0.18)"/><rect width="192" height="1" fill="rgb(25 95 191 / 0.18)"/>
    </pattern>
    
    <pattern id="minor-n" width="48" height="48" x="24" y="24" patternUnits="userSpaceOnUse">
      <rect width="1" height="48" fill="rgb(25 95 191 / 0.09)"/><rect width="48" height="1" fill="rgb(25 95 191 / 0.09)"/>
    </pattern>
    <pattern id="major-n" width="192" height="192" x="24" y="24" patternUnits="userSpaceOnUse">
      <rect width="1" height="192" fill="rgb(25 95 191 / 0.18)"/><rect width="192" height="1" fill="rgb(25 95 191 / 0.18)"/>
    </pattern>
    <linearGradient id="fade">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="grid-mask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  </defs>

  <g class="w">
    <g mask="url(#grid-mask)"><rect width="100%" height="291" fill="url(#minor-w)"/><rect width="100%" height="291" fill="url(#major-w)"/></g>
    <rect class="sq" x="40" y="64" width="8" height="8"/><text class="eye" x="60" y="72"><tspan class="name">SEBASTIAN VALDEMARSSON</tspan><tspan dx="16">KALMAR</tspan><tspan dx="16">56.66° N, 16.36° E</tspan></text>
    <text class="h1"><tspan x="40" y="156">Building stuff I actually</tspan><tspan x="40" y="217">want to use<tspan class="dot">.</tspan></tspan></text>
    <path class="p" d="M32.5 291.5h15M40 284v15"/><svg x="100%" overflow="visible"><path class="p" d="M-47.5 291.5h15M-40 284v15"/></svg>
  </g>

  <g class="m">
    <g mask="url(#grid-mask)"><rect width="100%" height="291" fill="url(#minor-w)"/><rect width="100%" height="291" fill="url(#major-w)"/></g>
    <rect class="sq" x="40" y="74" width="8" height="8"/><text class="eye" x="60" y="82"><tspan class="name">SEBASTIAN VALDEMARSSON</tspan><tspan dx="16">KALMAR</tspan><tspan dx="16">56.66° N, 16.36° E</tspan></text>
    <text class="h1"><tspan x="40" y="153">Building stuff I actually</tspan><tspan x="40" y="202">want to use<tspan class="dot">.</tspan></tspan></text>
    <path class="p" d="M32.5 291.5h15M40 284v15"/><svg x="100%" overflow="visible"><path class="p" d="M-47.5 291.5h15M-40 284v15"/></svg>
  </g>

  <g class="n">
    <g mask="url(#grid-mask)"><rect width="100%" height="291" fill="url(#minor-n)"/><rect width="100%" height="291" fill="url(#major-n)"/></g>
    <rect class="sq" x="24" y="71" width="7" height="7"/><text class="eye" x="43" y="78"><tspan class="name">SEBASTIAN VALDEMARSSON</tspan></text><text class="eye place" x="233.2" y="78">KALMAR</text>
    <text class="h1"><tspan x="24" y="134">Building stuff</tspan><tspan x="24" y="171">I actually</tspan><tspan x="24" y="208">want to use<tspan class="dot">.</tspan></tspan></text>
    <path class="p" d="M16.5 291.5h15M24 284v15"/><svg x="100%" overflow="visible"><path class="p" d="M-31.5 291.5h15M-24 284v15"/></svg>
  </g>

  <g class="stars"><path class="p s" style="animation-delay:-2s" d="M424 15.5v17M415.5 24h17"/><path class="p s" style="animation-delay:-7s" d="M616 207.5v17M607.5 216h17"/><path class="p s" style="animation-delay:-11s" d="M808 15.5v17M799.5 24h17"/></g>
  <rect y="291" width="100%" height="1" fill="rgb(19 25 34 / 0.12)"/>
</svg>
