<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" role="img" aria-label="Sebastian Valdemarsson, Kalmar. Building stuff I actually want to use.">
  <style>
    @font-face { font-family: 'Mona Sans'; font-weight: 700; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }
    .eyebrow { font: 500 12px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.06em; fill: #8a9098; }
    .name { font-weight: 600; fill: #82b4f6; }
    .h1 { font: 700 60px 'Mona Sans', system-ui, sans-serif; letter-spacing: -0.03em; fill: #eceff2; }
    .em { fill: #82b4f6; }
    .crop { fill: none; stroke: #8a9098; stroke-width: 1; opacity: 0.6; }
    .p { fill: none; stroke: #82b4f6; stroke-width: 1.5; }
    .s { opacity: 0; transform-box: fill-box; transform-origin: center; }
    /* Twinkle only with a mouse. On phones the constant repaints made the
       GitHub app's scrollbar flicker, and still marks save battery. */
    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      .s { animation: twinkle 7s ease-in-out infinite; }
    }
    @keyframes twinkle {
      0%, 30%, 100% { opacity: 0; transform: scale(0.7); }
      14% { opacity: 1; transform: scale(1.3); }
    }
    .narrow { display: none; }
    /* Phones: measured against the image's own width, not the screen. */
    @media (max-width: 640px) {
      .wide { display: none; }
      .narrow { display: inline; }
      .eyebrow { font-size: 11px; }
      .h1 { font-size: 36px; }
    }
  </style>
  <defs>
    <pattern id="minor" width="48" height="48" y="36" patternUnits="userSpaceOnUse">
      <rect width="1" height="48" fill="#82b4f6" fill-opacity="0.08"/>
      <rect width="48" height="1" fill="#82b4f6" fill-opacity="0.08"/>
    </pattern>
    <pattern id="major" width="192" height="192" x="96" y="36" patternUnits="userSpaceOnUse">
      <rect width="1" height="192" fill="#82b4f6" fill-opacity="0.15"/>
      <rect width="192" height="1" fill="#82b4f6" fill-opacity="0.15"/>
    </pattern>
    <!-- Toned down to 45 % behind the text, full strength out to the right. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" x2="760" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.053" stop-color="#fff"/>
      <stop offset="0.237" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.737" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-mask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  </defs>

  <rect width="100%" height="100%" fill="#0d121a"/>
  <g mask="url(#grid-mask)">
    <rect width="100%" height="100%" fill="url(#minor)"/>
    <rect width="100%" height="100%" fill="url(#major)"/>
  </g>

  <!-- Crop marks in the corners, like a printed drawing. -->
  <path class="crop" d="M16.5 30V16.5H30M16.5 270V283.5H30"/>
  <svg x="100%" overflow="visible"><path class="crop" d="M-16.5 30V16.5H-30M-16.5 270V283.5H-30"/></svg>

  <g>
    <path class="p" d="M96 27.5v17M87.5 36h17" opacity=".5"/><path class="p s" style="animation-duration:7.0s;animation-delay:-5.2s" d="M96 27.5v17M87.5 36h17"/>
    <path class="p" d="M288 27.5v17M279.5 36h17" opacity=".5"/><path class="p s" style="animation-duration:7.0s;animation-delay:-0.0s" d="M288 27.5v17M279.5 36h17"/>
    <path class="p" d="M480 27.5v17M471.5 36h17" opacity=".5"/><path class="p s" style="animation-duration:8.3s;animation-delay:-4.5s" d="M480 27.5v17M471.5 36h17"/>
    <path class="p" d="M672 27.5v17M663.5 36h17"/><path class="p s" style="animation-duration:9.0s;animation-delay:-6.7s" d="M672 27.5v17M663.5 36h17"/>
    <path class="p" d="M864 27.5v17M855.5 36h17"/><path class="p s" style="animation-duration:8.3s;animation-delay:-7.1s" d="M864 27.5v17M855.5 36h17"/>
    <path class="p" d="M1056 27.5v17M1047.5 36h17"/><path class="p s" style="animation-duration:6.0s;animation-delay:-0.4s" d="M1056 27.5v17M1047.5 36h17"/>
    <path class="p" d="M1248 27.5v17M1239.5 36h17"/><path class="p s" style="animation-duration:8.4s;animation-delay:-7.0s" d="M1248 27.5v17M1239.5 36h17"/>
    <path class="p" d="M1440 27.5v17M1431.5 36h17"/><path class="p s" style="animation-duration:8.4s;animation-delay:-0.3s" d="M1440 27.5v17M1431.5 36h17"/>
    <path class="p" d="M1632 27.5v17M1623.5 36h17"/><path class="p s" style="animation-duration:7.7s;animation-delay:-4.9s" d="M1632 27.5v17M1623.5 36h17"/>
    <path class="p" d="M1824 27.5v17M1815.5 36h17"/><path class="p s" style="animation-duration:7.8s;animation-delay:-0.6s" d="M1824 27.5v17M1815.5 36h17"/>
    <path class="p" d="M2016 27.5v17M2007.5 36h17"/><path class="p s" style="animation-duration:7.4s;animation-delay:-2.0s" d="M2016 27.5v17M2007.5 36h17"/>
    <path class="p" d="M480 219.5v17M471.5 228h17" opacity=".5"/><path class="p s" style="animation-duration:7.6s;animation-delay:-7.5s" d="M480 219.5v17M471.5 228h17"/>
    <path class="p" d="M672 219.5v17M663.5 228h17"/><path class="p s" style="animation-duration:7.2s;animation-delay:-1.9s" d="M672 219.5v17M663.5 228h17"/>
    <path class="p" d="M864 219.5v17M855.5 228h17"/><path class="p s" style="animation-duration:7.8s;animation-delay:-5.7s" d="M864 219.5v17M855.5 228h17"/>
    <path class="p" d="M1056 219.5v17M1047.5 228h17"/><path class="p s" style="animation-duration:7.5s;animation-delay:-6.2s" d="M1056 219.5v17M1047.5 228h17"/>
    <path class="p" d="M1248 219.5v17M1239.5 228h17"/><path class="p s" style="animation-duration:5.4s;animation-delay:-2.3s" d="M1248 219.5v17M1239.5 228h17"/>
    <path class="p" d="M1440 219.5v17M1431.5 228h17"/><path class="p s" style="animation-duration:5.2s;animation-delay:-0.4s" d="M1440 219.5v17M1431.5 228h17"/>
    <path class="p" d="M1632 219.5v17M1623.5 228h17"/><path class="p s" style="animation-duration:6.9s;animation-delay:-1.2s" d="M1632 219.5v17M1623.5 228h17"/>
    <path class="p" d="M1824 219.5v17M1815.5 228h17"/><path class="p s" style="animation-duration:7.6s;animation-delay:-6.4s" d="M1824 219.5v17M1815.5 228h17"/>
    <path class="p" d="M2016 219.5v17M2007.5 228h17"/><path class="p s" style="animation-duration:6.2s;animation-delay:-2.5s" d="M2016 219.5v17M2007.5 228h17"/>
  </g>

  <g class="wide">
    <text class="eyebrow" x="48" y="94"><tspan class="name">SEBASTIAN VALDEMARSSON</tspan><tspan dx="20">KALMAR</tspan><tspan dx="20">56.66° N, 16.36° E</tspan></text>
    <text class="h1"><tspan x="48" y="174">Building stuff I actually</tspan><tspan x="48" y="234">want to <tspan class="em">use.</tspan></tspan></text>
  </g>
  <g class="narrow">
    <text class="eyebrow" x="24" y="88"><tspan class="name">SEBASTIAN VALDEMARSSON</tspan><tspan dx="14">KALMAR</tspan></text>
    <text class="h1"><tspan x="24" y="140">Building stuff I</tspan><tspan x="24" y="178">actually want to</tspan><tspan x="24" y="216" class="em">use.</tspan></text>
  </g>
</svg>
