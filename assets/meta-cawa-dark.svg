<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="30" role="img" aria-label="App, on Google Play and the web. App Store soon.">
  <style>
    @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font: 500 11.2px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em; }
    .kind { fill: #8a9098; }
    .tag { fill: #afb5bc; }
    .box { fill: none; stroke: rgb(236 239 242 / 0.3); stroke-width: 1; }
    /* Kommer snart: streckad kant och svagare text, ingen färg. */
    .box.soon { stroke-dasharray: 3 2; }
    .tag.soon { fill: #8a9098; }
    .sq { fill: #82b4f6; }
    .new { font-weight: 600; fill: #82b4f6; }
    .row { transform-origin: 0 15px; }
    @media (max-width: 331px) { .row { transform: scale(0.92); } }
    @media (max-width: 304px) { .row { transform: scale(0.84); } }
    @media (max-width: 278px) { .row { transform: scale(0.76); } }
  </style>
  <g class="row">
  <text class="kind" x="0" y="19">APP</text>
  <rect class="box" x="42.29" y="4" width="104.26" height="21.7"/>
  <text class="tag" x="50.07" y="19">GOOGLE PLAY</text>
  <rect class="box" x="153.96" y="4" width="39.75" height="21.7"/>
  <text class="tag" x="161.74" y="19">WEB</text>
  <rect class="box soon" x="201.11" y="4" width="128.46" height="21.7"/>
  <text class="tag soon" x="208.89" y="19">APP STORE SOON</text>
  </g>
</svg>
